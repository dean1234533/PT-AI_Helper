# Cloudflare Pages config
# Deploy via: wrangler pages deploy dist --project-name=dbs-app
# Or connect to GitHub in the Cloudflare Pages dashboard (recommended).

name = "dbs-app"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# ── Environment variables ────────────────────────────────────────────────────
# Add these in Cloudflare Pages dashboard → Settings → Environment variables:
#
#   GEMINI_API_KEY
#   GROQ_API_KEY
#   CEREBRAS_API_KEY
#   OPENROUTER_API_KEY
#   MISTRAL_API_KEY
#   FIREBASE_PROJECT_ID
#   FIREBASE_API_KEY
#   RESEND_API_KEY
#   RESEND_FROM_EMAIL
#   STRIPE_SECRET_KEY
#   STRIPE_PRICE_ID
#   STRIPE_PORTAL_RETURN_URL
#   APP_URL                    (e.g. https://dbsai.com)
#   USDA_API_KEY               (optional — uses DEMO_KEY if absent)

# ── Cron trigger ─────────────────────────────────────────────────────────────
# Cloudflare Pages does NOT support native Cron Triggers for this project —
# confirmed via a failed build ([triggers] is rejected for Pages config) and
# via the Cloudflare API (no schedule surface exists for this project/script).
# The daily batch (weekly check-in reminder + daily workout-day push) is
# instead driven by an external scheduler (e.g. cron-job.org) hitting:
#   POST https://<your-domain>/api/ScheduledCheckins?runAll=true
#   Header: X-Cron-Secret: <CRON_SECRET env var>
# See /functions/api/ScheduledCheckins.js for the handler.
